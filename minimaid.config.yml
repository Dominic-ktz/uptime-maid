# ─────────────────────────────────────────────
#  Minimaid – Konfiguration
# ─────────────────────────────────────────────

site:
  title: "BiteBytes Services"
  description: "Serverless Status Monitor by BiteBytes Group"
  url: "https://status.dominic-ktz.de"

theme:
  accent: "#ff2d95"        # Cyberpunk-Pink (Hauptfarbe)
  secondary: "#00d4ff"     # Neon-Blau
  success: "#39ff14"       # Giftgrün (Online)
  danger: "#ff073a"        # Neon-Rot (Offline)
  warning: "#ffbe0b"       # Neon-Gelb (Degraded)
  background: "#07070e"    # Hintergrund

# Service-Typen: http, tcp, minecraft-java, minecraft-bedrock, fivem
# Optionale Felder für alle: description, link (wird auf der Status-Seite verlinkt)
# Optionale Felder für http: expectedStatus (Zahl oder Liste), method, keyword, headers
services:
  - id: "main-website"
    name: "Kisara-de"
    type: "http"
    url: "https://kisara.de"
    expectedStatus: 200

  - id: "random-gif-api"
    name: "Random GIF API"
    type: "http"
    url: "https://gifs.rndmserv.de"
    expectedStatus: 200

notifications:
  discord:
    enabled: false
    # Setze DISCORD_WEBHOOK_URL als GitHub Secret
    webhook_url: "${DISCORD_WEBHOOK_URL}"
    username: "Minimaid"
    avatar_url: ""

settings:
  check_timeout: 10000     # Timeout pro Check in ms
  history_max_days: 90     # Wie lange History aufbewahren (Tage)
  retries: 1               # Wiederholungen, bevor ein Service als gestört gilt
  retry_delay: 2000        # Pause zwischen den Wiederholungen in ms
